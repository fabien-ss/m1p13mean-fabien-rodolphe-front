<div class="space-y-5">
  <div>
    <h4 class="text-base font-semibold text-gray-800 dark:text-white/90">Reset Password</h4>
    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
      Reset password for <span class="font-medium text-gray-700 dark:text-gray-300">{{ user.firstName }} {{ user.name }}</span>
    </p>
  </div>

  <div>
    <app-label>New Password *</app-label>
    <app-input-field type="password" name="password" [(ngModel)]="password" class="w-full" />
  </div>

  <div>
    <app-label>Confirm Password *</app-label>
    <app-input-field type="password" name="confirmPassword" [(ngModel)]="confirmPassword" class="w-full" />
  </div>

  @if (errorMessage) {
    <div class="rounded-lg border border-red-200 bg-red-50 dark:border-red-800 dark:bg-red-900/10 px-4 py-3 text-sm text-red-600 dark:text-red-400">
      ⚠️ {{ errorMessage }}
    </div>
  }

  @if (successMessage) {
    <div class="rounded-lg border border-green-200 bg-green-50 dark:border-green-800 dark:bg-green-900/10 px-4 py-3 text-sm text-green-600 dark:text-green-400">
      ✓ {{ successMessage }}
    </div>
  }

  <div class="flex justify-end gap-2 pt-2">
    <app-button size="sm" variant="outline" type="button" (click)="close.emit()">Cancel</app-button>
    <button type="button" (click)="onSave()" [disabled]="isLoading"
      class="inline-flex items-center gap-2 rounded-lg bg-brand-500 px-4 py-2.5 text-theme-sm font-medium text-white hover:bg-brand-600 disabled:opacity-50">
      {{ isLoading ? 'Resetting...' : 'Reset Password' }}
    </button>
  </div>
</div>
