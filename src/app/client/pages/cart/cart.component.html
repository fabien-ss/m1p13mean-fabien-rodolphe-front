<div class="container mx-auto mt-10">
  <h1 class="text-3xl font-bold mb-5">Shopping Cart</h1>
  <div *ngIf="cartItems.length > 0; else emptyCart">
    <table class="w-full table-auto">
      <thead>
        <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
          <th class="py-3 px-6 text-left">Product</th>
          <th class="py-3 px-6 text-left">Price</th>
          <th class="py-3 px-6 text-center">Quantity</th>
          <th class="py-3 px-6 text-center">Total</th>
          <th class="py-3 px-6 text-center">Actions</th>
        </tr>
      </thead>
      <tbody class="text-gray-600 text-sm font-light">
        @for (item of cartItems; track $index) {
        <tr class="border-b border-gray-200 hover:bg-gray-100">
          <td class="py-3 px-6 text-left whitespace-nowrap">
            <div class="flex items-center">
              <div class="mr-2">
                <img class="w-10 h-10 rounded-full" [src]="item.image"
                  [alt]="item.name">
              </div>
              <span>{{ item.name }}</span>
            </div>
          </td>
          <td class="py-3 px-6 text-left">
            <span>{{ item.price | currency }}</span>
          </td>
          <td class="py-3 px-6 text-center">
            <span>{{ item.qty }}</span>
          </td>
          <td class="py-3 px-6 text-center">
            <span>{{ item.price * item.qty | currency }}</span>
          </td>
          <td class="py-3 px-6 text-center">
            <button (click)="removeFromCart(item.id)"
              class="bg-red-500 text-white py-1 px-3 rounded-full text-xs">Remove</button>
          </td>
        </tr>
        }
      </tbody>
    </table>
    <div class="mt-5 flex justify-between items-center">
      <button (click)="clearCart()"
        class="bg-red-500 text-white py-2 px-4 rounded">Clear Cart</button>
      <div class="text-right">
        <p class="text-lg font-bold">Total: {{ getTotalPrice() | currency }}</p>
      </div>
    </div>
  </div>
  <ng-template #emptyCart>
    <p class="text-center text-gray-500">Your cart is empty.</p>
  </ng-template>
</div>
