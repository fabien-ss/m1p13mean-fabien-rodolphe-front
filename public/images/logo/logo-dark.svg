<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="200" height="100">
  <defs>
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1f4f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a8f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shineGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.07" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    <filter id="shadowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="380" height="180" rx="28" ry="28" fill="url(#bgGradDark)" filter="url(#shadowDark)"/>
  <!-- Shine overlay -->
  <rect x="10" y="10" width="380" height="90" rx="28" ry="28" fill="url(#shineGradDark)"/>

  <!-- Decorative circles top right -->
  <circle cx="345" cy="38" r="5" fill="#7aa4ff" opacity="0.3"/>
  <circle cx="362" cy="28" r="3" fill="#7aa4ff" opacity="0.2"/>
  <circle cx="358" cy="50" r="4" fill="#7aa4ff" opacity="0.22"/>
  <circle cx="374" cy="42" r="6" fill="#7aa4ff" opacity="0.14"/>

  <!-- Decorative circle bottom left -->
  <circle cx="25" cy="170" r="40" fill="white" opacity="0.04"/>

  <!-- AKOOR text -->
  <text x="70" y="118" font-family="'Georgia', 'Times New Roman', serif" font-size="72" font-weight="900" fill="#e8efff" letter-spacing="-2">AKOOR</text>

  <!-- Tagline -->
  <text x="70" y="148" font-family="'Georgia', serif" font-size="15" font-weight="400" fill="#a8c0ff" letter-spacing="5" opacity="0.8">MALL · MADAGASCAR</text>

  <!-- Decorative bottom line -->
  <rect x="118" y="156" width="242" height="2" rx="2" fill="#7aa4ff" opacity="0.25"/>
</svg>